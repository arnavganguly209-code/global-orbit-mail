# GLOBAL ORBIT MAIL — Nginx vhost for Next.js webmail
# Placeholders: __WEBMAIL_HOST__ __ORBIT_WEBMAIL_PORT__
# TLS certificates: adjust ssl_certificate paths to match the VPS (certbot).

upstream orbit_webmail_upstream {
    server 127.0.0.1:__ORBIT_WEBMAIL_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __WEBMAIL_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WEBMAIL_HOST__;

    # Certbot / Let's Encrypt — update if paths differ on this host
    ssl_certificate     /etc/letsencrypt/live/__WEBMAIL_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__WEBMAIL_HOST__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Root → webmail app
    location = / {
        return 302 /webmail/login;
    }

    location / {
        proxy_pass http://orbit_webmail_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
