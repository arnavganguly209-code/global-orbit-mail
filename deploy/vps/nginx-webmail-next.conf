# GLOBAL ORBIT MAIL — Nginx vhost for Next.js webmail ONLY
# Placeholders replaced by deploy-orbit-webmail.sh:
#   __WEBMAIL_HOST__  __ORBIT_WEBMAIL_PORT__
#   __SSL_CERTIFICATE__  __SSL_CERTIFICATE_KEY__
#   __SSL_OPTIONS_LINE__  __SSL_DHPARAM_LINE__
# Roundcube PHP must never be served on this host.
# Public UI paths: /  /login  /mail  /compose  /settings  /contacts
# Legacy /webmail/* is redirected by Next.js (308).

upstream orbit_webmail_upstream {
    server 127.0.0.1:__ORBIT_WEBMAIL_PORT__;
    keepalive 32;
}

map $arg__task $orbit_is_roundcube_task {
    default 0;
    "~.+"   1;
}

server {
    listen 80;
    listen [::]:80;
    server_name __WEBMAIL_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WEBMAIL_HOST__;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    __SSL_OPTIONS_LINE__
    __SSL_DHPARAM_LINE__

    client_max_body_size 50m;

    # Never expose PHP / Roundcube assets → login home
    location ~* \.php(/|$) {
        return 301 /;
    }

    location ~* ^/(skins|plugins|program|installer|bin|SQL|vendor|temp|logs)(/|$) {
        return 301 /;
    }

    location = /index.php {
        return 301 /;
    }

    location = /robots.txt {
        proxy_pass http://orbit_webmail_upstream;
    }

    # Legacy Roundcube deep-links (?_task=mail …)
    if ($orbit_is_roundcube_task = 1) {
        return 301 /;
    }

    location / {
        proxy_pass http://orbit_webmail_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
    }
}
